<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ScholarForge AI — turn your notes into practice</title>
    <meta
      name="description"
      content="Upload a PDF, slides, or a book. Get quizzes, flashcards, explanations, and a practice exam. Every answer shows the page it came from. Free, no account, works offline."
    />

    <!-- Open Graph / Twitter Card. og:image is a relative path until this app has a fixed
         production domain; most crawlers resolve it fine, but recheck once deployed. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ScholarForge AI — turn your notes into practice" />
    <meta
      property="og:description"
      content="Upload a PDF, slides, or a book. Get quizzes, flashcards, explanations, and a practice exam. Every answer shows the page it came from. Free, no account, works offline."
    />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ScholarForge AI — turn your notes into practice" />
    <meta
      name="twitter:description"
      content="Upload a PDF, slides, or a book. Get quizzes, flashcards, explanations, and a practice exam. Free, no account, works offline."
    />
    <meta name="twitter:image" content="/icons/icon-512.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <script>
      // Sets the theme before first paint so there is no flash of the wrong one.
      // Default is dark; a saved preference of 'light' is the only way to opt out.
      (function () {
        try {
          var saved = localStorage.getItem('sf-theme');
          var dark = saved !== 'light';
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
