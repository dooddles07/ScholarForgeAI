name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The point of the proxy is that the key never reaches a browser. Prove it every build.
      - name: Scan the bundle for key-shaped strings
        # This intentionally does not need updating for Firebase's client config key: CI never
        # sets VITE_FIREBASE_API_KEY, so Vite bakes in `undefined`, not a real "AIza..." string,
        # and this check never sees one. GROQ_API_KEY is the one this check exists to catch.
        run: |
          if grep -rEq 'gsk_[0-9A-Za-z]{20,}|AIza[0-9A-Za-z_-]{35}|sk-[0-9A-Za-z]{20,}' dist/; then
            echo "A key-shaped string is present in the build output."
            exit 1
          fi
          echo "No key-shaped strings in dist/."

      # There is no paid tier and there never will be. Catch it if wording drifts.
      - name: Check for payment language
        run: |
          if grep -rEiq '\b(upgrade to|premium plan|subscribe now|free trial|paywall)\b' src/; then
            echo "Payment language found in src/."
            exit 1
          fi
          echo "No payment language."

      - name: Check the initial bundle size
        run: |
          # dist/assets can hold more than one index-*.js chunk (lazy dynamic imports get the
          # same prefix), so the real entry chunk is read from the one <script type="module">
          # tag in dist/index.html rather than guessed from a directory listing.
          MAIN_SRC=$(grep -oE '/assets/index-[^"]+\.js' dist/index.html | head -1)
          if [ -z "$MAIN_SRC" ]; then
            echo "Could not find the entry chunk reference in dist/index.html."
            exit 1
          fi
          MAIN="dist${MAIN_SRC}"
          SIZE=$(gzip -c "$MAIN" | wc -c)
          echo "Initial bundle: $MAIN ($SIZE bytes gzipped)"
          if [ "$SIZE" -gt 307200 ]; then
            echo "Over the 300 KB gzipped budget."
            exit 1
          fi

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve and audit
        run: |
          npx vite preview --port 5180 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5180 >/dev/null && break
            sleep 1
          done
          node tests/e2e/axe-audit.mjs
